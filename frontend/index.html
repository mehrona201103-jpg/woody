<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#050b1e">
  <title>Woody</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main id="app">
    <header class="topbar">
      <div class="indicators">
        <span id="status-label" class="status">&nbsp;</span>
        <span id="cam-badge" class="badge hidden">● CAMERA ON</span>
        <span id="mic-badge" class="badge hidden">● MIC ON</span>
      </div>
      <div class="top-actions">
        <button id="btn-gesture" class="icon-btn" aria-label="Камера и жесты" title="Камера и жесты">👁</button>
        <button id="btn-settings" class="icon-btn" aria-label="Настройки">⚙</button>
      </div>
    </header>

    <div id="banner" class="banner hidden" role="alert">
      <span id="banner-text">Не удалось подключиться к Woody.</span>
      <button id="banner-retry" class="ghost">Повторить</button>
    </div>

    <section class="stage">
      <div id="cam-wrap" class="cam-wrap hidden">
        <video id="cam-video" playsinline muted autoplay></video>
        <span id="cam-gesture" class="cam-gesture"></span>
      </div>
      <svg id="face" viewBox="0 -60 400 360" role="img" aria-label="Лицо Woody">
        <defs>
          <clipPath id="clip-l"><ellipse rx="42" ry="46"/></clipPath>
          <clipPath id="clip-r"><ellipse rx="42" ry="46"/></clipPath>
          <radialGradient id="fx-glow"><stop offset="0" stop-color="#3de0ff" stop-opacity=".55"/><stop offset="1" stop-color="#3de0ff" stop-opacity="0"/></radialGradient>
        </defs>
        <g id="learn-fx" class="learn-fx" aria-hidden="true">
          <ellipse cx="200" cy="-18" rx="120" ry="34" fill="url(#fx-glow)"/>
          <g class="fx-bars">
            <rect x="152" y="-30" width="9" height="28" rx="4.5"/><rect x="170" y="-30" width="9" height="28" rx="4.5"/>
            <rect x="188" y="-30" width="9" height="28" rx="4.5"/><rect x="206" y="-30" width="9" height="28" rx="4.5"/>
            <rect x="224" y="-30" width="9" height="28" rx="4.5"/><rect x="242" y="-30" width="9" height="28" rx="4.5"/>
          </g>
          <g class="fx-orbit"><circle cx="86" cy="-16" r="4"/><circle cx="314" cy="-16" r="3"/><circle cx="130" cy="-44" r="2.5"/><circle cx="272" cy="-46" r="2.5"/></g>
          <g class="fx-rise"><circle cx="140" cy="10" r="3"/><circle cx="200" cy="8" r="2.5"/><circle cx="262" cy="10" r="3"/><circle cx="170" cy="14" r="2"/><circle cx="232" cy="14" r="2"/></g>
        </g>
        <g id="eye-l" transform="translate(120 110)"><ellipse class="eye-white" rx="42" ry="46"/><g class="pupil-g"><circle class="pupil" r="17"/><circle class="shine" cx="-6" cy="-7" r="5"/><circle class="shine small" cx="6" cy="5" r="2.2"/></g><path class="lid" clip-path="url(#clip-l)" d="M-48 -52 L48 -52 L48 -52 L-48 -52 Z"/></g>
        <g id="eye-r" transform="translate(280 110)"><ellipse class="eye-white" rx="42" ry="46"/><g class="pupil-g"><circle class="pupil" r="17"/><circle class="shine" cx="-6" cy="-7" r="5"/><circle class="shine small" cx="6" cy="5" r="2.2"/></g><path class="lid" clip-path="url(#clip-r)" d="M-48 -52 L48 -52 L48 -52 L-48 -52 Z"/></g>
        <path id="brow-l" class="brow" d="M80 50 Q120 40 160 50"/>
        <path id="brow-r" class="brow" d="M240 50 Q280 40 320 50"/>
        <path id="mouth" class="mouth" d="M150 224 Q200 232 250 224"/>
      </svg>
    </section>

    <!-- Знакомство: отдельная карточка под лицом, не перекрывает рот -->
    <section id="intro" class="intro hidden">
      <p id="intro-text">Привет! Я Woody.</p>
      <form id="name-form" class="hidden">
        <input id="name-input" autocomplete="given-name" maxlength="50" placeholder="Твоё имя" required>
        <button type="submit" class="primary">Познакомиться</button>
      </form>
    </section>

    <section id="chat" class="chat" aria-live="polite"></section>

    <footer class="controls">
      <form id="chat-form" autocomplete="off">
        <input id="chat-input" placeholder="Напиши Woody…" maxlength="2000" enterkeyhint="send">
        <button type="submit" class="send" aria-label="Отправить">➤</button>
      </form>
      <div class="buttons">
        <button id="btn-talk" class="talk"><span class="mic">🎙</span> Говорить</button>
        <button id="btn-stop" class="stop" aria-label="Остановить Woody">■</button>
      </div>
    </footer>
  </main>

  <aside id="settings" class="drawer hidden" aria-label="Woody Settings">
    <div class="drawer-head"><h2>Woody Settings</h2><button id="settings-close" class="icon-btn" aria-label="Закрыть">✕</button></div>
    <div id="settings-body"></div>
  </aside>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-box">
      <p id="modal-text"></p>
      <div class="modal-actions" id="modal-actions"></div>
    </div>
  </div>

  <div id="transfer" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-box transfer-box">
      <h2>Передай Woody</h2>
      <div id="transfer-qr" class="qr"></div>
      <p id="transfer-link" class="note link"></p>
      <p id="transfer-timer" class="note"></p>
      <p class="note">В ссылке нет ни имени, ни памяти, ни сообщений — только одноразовый код.</p>
      <div class="modal-actions"><button id="transfer-close">Закрыть</button></div>
    </div>
  </div>

  <!-- Эффект как у AirDrop: радар, устройство рядом, пузырь Woody летит к нему -->
  <div id="airdrop" class="airdrop hidden" role="dialog" aria-modal="true">
    <div class="ad-stage">
      <div class="ad-ring r1"></div><div class="ad-ring r2"></div><div class="ad-ring r3"></div>
      <div id="ad-me" class="ad-me">W</div>
      <div id="ad-peer" class="ad-peer hidden"><span>📱</span><small>Устройство рядом</small></div>
      <div id="ad-bubble" class="ad-bubble hidden">W</div>
    </div>
    <p id="ad-text" class="ad-text">Ищу устройства рядом…</p>
    <div class="ad-actions">
      <button id="ad-send" class="primary hidden">Отправить приглашение</button>
      <button id="ad-qr" class="ghost hidden">Показать QR</button>
      <button id="ad-close" class="ghost">Закрыть</button>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/face.js"></script>
  <script src="/js/permissions.js"></script>
  <script src="/js/voice.js"></script>
  <script src="/js/gestures.js"></script>
  <script src="/js/hands.js"></script>
  <script src="/js/device.js"></script>
  <script src="/js/chat.js"></script>
  <script src="/js/transfer.js"></script>
  <script src="/js/airdrop.js"></script>
  <script src="/js/learn.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
